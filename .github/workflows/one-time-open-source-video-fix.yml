name: One-time open-source video fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch video source route
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          text = p.read_text()
          start = text.index('app.get("/api/media/videos", async (req, res) => {')
          end = text.index('app.post("/api/media/videos/:videoId/view", async (req, res) => {', start)
          replacement = r'''const OPEN_SOURCE_VIDEO_QUERIES = [
  "Kannada news", "Kannada cinema", "Kannada music", "Kannada comedy",
  "Kannada education", "Kannada technology", "Kannada sports", "Karnataka history",
  "Karnataka culture", "Kannada food", "Kannada travel", "Kannada agriculture",
  "Kannada business", "Kannada science", "Kannada interview", "Kannada devotional",
];

function normalizeOpenSourceVideo(item, source) {
  const url = String(item?.url || item?.videoUrl || item?.streamUrl || "").trim();
  if (!/^https:\/\//i.test(url)) return null;
  const mime = String(item?.mime || item?.type || "video/mp4").toLowerCase();
  if (!mime.includes("video") && !/\.(mp4|webm|ogv|ogg)(?:$|[?#])/i.test(url)) return null;
  const size = Number(item?.size || item?.filesize || 0);
  if (size > 700 * 1024 * 1024) return null;
  const id = String(item?.id || `${source}:${url}`).replace(/[^a-zA-Z0-9._:-]/g, "_").slice(0, 180);
  return { id: `opensource-${id}`, title: String(item?.title || item?.name || "Open-source video").replace(/<[^>]*>/g, "").trim().slice(0, 240), creator: String(item?.creator || item?.user || source).replace(/<[^>]*>/g, "").trim().slice(0, 120), ownerUid: "", description: String(item?.description || item?.license || "Open-licensed media").replace(/<[^>]*>/g, "").trim().slice(0, 500), videoUrl: url, secureUrl: url, streamUrl: url, thumbnailUrl: String(item?.thumbnail || item?.thumburl || "").trim(), mediaType: "video", source, license: String(item?.license || item?.license_short || "open").slice(0, 120), createdAt: Number(item?.createdAt || item?.indexed_on || Date.now()), likes: 0, comments: 0, shares: 0, saves: 0, views: 0 };
}

async function fetchJson(url, timeoutMs = 9000) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const response = await fetch(url, { headers: { Accept: "application/json", "User-Agent": "Indo/1.0 open-source-video-feed" }, signal: controller.signal });
    if (!response.ok) return null;
    return await response.json().catch(() => null);
  } finally { clearTimeout(timer); }
}

async function fetchWikimediaVideos(query, limit = 12) {
  const params = new URLSearchParams({ action: "query", format: "json", formatversion: "2", origin: "*", generator: "search", gsrsearch: query, gsrnamespace: "6", gsrlimit: String(Math.min(20, limit)), prop: "imageinfo", iiprop: "url|mime|size|mediatype|extmetadata" });
  const data = await fetchJson(`https://commons.wikimedia.org/w/api.php?${params}`);
  const pages = Array.isArray(data?.query?.pages) ? data.query.pages : [];
  return pages.map((page) => {
    const info = page?.imageinfo?.[0] || {};
    const meta = info.extmetadata || {};
    return normalizeOpenSourceVideo({ id: page?.pageid || page?.title, title: page?.title?.replace(/^File:/, "") || "Wikimedia video", creator: meta?.Artist?.value || info?.user || "Wikimedia Commons", description: meta?.ImageDescription?.value || "", license: meta?.LicenseShortName?.value || "open", url: info?.url, mime: info?.mime, size: info?.size, thumbnail: info?.thumburl }, "Wikimedia Commons");
  }).filter(Boolean);
}

async function fetchInternetArchiveVideos(query, limit = 8) {
  const q = encodeURIComponent(`mediatype:movies AND (title:"${query}" OR subject:"${query}")`);
  const search = await fetchJson(`https://archive.org/advancedsearch.php?q=${q}&fl[]=identifier&fl[]=title&fl[]=creator&fl[]=description&rows=${Math.min(12, limit)}&page=1&output=json`);
  const docs = Array.isArray(search?.response?.docs) ? search.response.docs : [];
  const results = await Promise.all(docs.map(async (doc) => {
    const id = String(doc?.identifier || "").trim();
    if (!id) return null;
    const meta = await fetchJson(`https://archive.org/metadata/${encodeURIComponent(id)}`);
    const files = Array.isArray(meta?.files) ? meta.files : [];
    const candidates = files.filter((file) => { const name = String(file?.name || ""); const format = String(file?.format || "").toLowerCase(); const size = Number(file?.size || 0); return size <= 700 * 1024 * 1024 && (format.includes("mpeg4") || format.includes("h.264") || /\.mp4$/i.test(name)) && !/(thumb|sample|preview)/i.test(name); }).sort((a, b) => Number(b?.size || 0) - Number(a?.size || 0));
    const file = candidates[0];
    if (!file) return null;
    const url = `https://archive.org/download/${encodeURIComponent(id)}/${String(file.name).split("/").map(encodeURIComponent).join("/")}`;
    return normalizeOpenSourceVideo({ id, title: doc?.title, creator: doc?.creator, description: doc?.description, url, mime: "video/mp4", size: file?.size, license: meta?.metadata?.licenseurl || meta?.metadata?.license }, "Internet Archive");
  }));
  return results.filter(Boolean);
}

app.get("/api/media/videos", async (req, res) => {
  if (!db) return res.status(503).json({ ok: false, error: "Service unavailable." });
  const limit = Math.min(50, Math.max(1, Number(req.query.limit) || 20));
  const type = String(req.query.type || "").trim().toLowerCase();
  const language = String(req.query.language || "Kannada").trim() || "Kannada";
  const topic = String(req.query.topic || "").trim();
  try {
    const snapshot = await db.ref("videos").get();
    let videos = Object.values(snapshot.val() || {}).filter((item) => item && String(item.storage?.provider || item.telegram?.provider || "") === "telegram");
    videos.sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
    if (type === "video" || type === "reel") videos = videos.filter((item) => (item.mediaType || "video") === type);
    const baseUrl = `${req.protocol || "https"}://${req.get("host")}`;
    videos = videos.slice(0, limit).map((item) => { const video = { ...item }; const provider = String(video.storage?.provider || video.telegram?.provider || "").toLowerCase(); if (provider === "telegram" && video.id) { const streamUrl = `${baseUrl}/api/media/videos/${encodeURIComponent(video.id)}/telegram-stream`; video.streamUrl = video.streamUrl || streamUrl; video.videoUrl = video.videoUrl || video.secureUrl || streamUrl; video.secureUrl = video.secureUrl || video.videoUrl || streamUrl; } return video; });
    const openQueries = topic ? [`${language} ${topic}`] : OPEN_SOURCE_VIDEO_QUERIES.map((item) => item.replace(/^Kannada/, language)).slice(0, 4);
    const openResults = await Promise.allSettled(openQueries.flatMap((query) => [fetchWikimediaVideos(query, 8), fetchInternetArchiveVideos(query, 5)]));
    const openVideos = openResults.flatMap((result) => result.status === "fulfilled" && Array.isArray(result.value) ? result.value : []);
    const seen = new Set(videos.map((item) => String(item.id || item.videoUrl || "")));
    for (const item of openVideos) { const key = String(item.videoUrl || item.id || ""); if (!key || seen.has(key)) continue; seen.add(key); videos.push(item); if (videos.length >= limit) break; }
    return res.json({ ok: true, videos: videos.slice(0, limit) });
  } catch (error) { console.warn("Open-source video feed failed:", error?.message || error); return res.status(500).json({ ok: false, error: "Could not load videos." }); }
});

'''
          p.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Validate
        run: node --check server.js

      - name: Commit patched server
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js
          git commit -m "Fix open-source video feed sources"
          git push
