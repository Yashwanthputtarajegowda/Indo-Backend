name: Format code once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format source
        run: npx --yes prettier@3.6.2 --write "**/*.{js,mjs,cjs,css,json,html,yml,yaml}" --ignore-path /dev/null

      - name: Remove one-shot formatter
        run: rm -f .github/workflows/format-code-once.yml

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: format backend code"
          git push
