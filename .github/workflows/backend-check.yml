name: Backend Check

on:
  workflow_dispatch:
  push:
    paths:
      - "server.js"
      - "services/**"
      - "routes/**"
      - "scripts/**"
      - "*.mjs"
      - "package.json"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "server.js"
      - "services/**"
      - "routes/**"
      - "scripts/**"
      - "*.mjs"
      - "package.json"
      - ".github/workflows/backend-check.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: |
          node --check server.js
          node --check telegram-boot.mjs
          node --check scripts/production-preflight.mjs

      - name: Health and Telegram route smoke check
        run: |
          PORT=3001 npm start > /tmp/indo-backend.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          sleep 4
          curl --fail --silent http://127.0.0.1:3001/api/health
          curl --fail --silent http://127.0.0.1:3001/api/telegram/storage-health
          status=$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/octet-stream' \
            --data-binary '' \
            http://127.0.0.1:3001/api/telegram/uploads)
          test "$status" = "401"
