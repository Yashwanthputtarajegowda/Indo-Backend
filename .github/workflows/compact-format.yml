name: Compact format
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compact source formatting
        run: npx --yes prettier@3.9.6 --write --print-width 100 "scripts/**/*.{js,mjs,json}" "routes/**/*.{js,mjs,css,html}" "services/**/*.{js,mjs,css,html}" "*.{js,mjs,json,css,html}" --ignore-path .gitignore
      - name: Remove temporary formatter
        run: rm -f .github/workflows/compact-format.yml
      - name: Commit compact formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts routes services
          git add *.js *.mjs *.json *.css *.html 2>/dev/null || true
          git rm -f .github/workflows/compact-format.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: compact repository formatting"
          git push
