name: One-time backend audit fixes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'chore: apply backend audit fixes') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply backend fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          backend = Path('server.js')
          text = backend.read_text()

          old_cors = '''const CORS_ORIGINS = String(\n  process.env.CORS_ORIGINS || "http://localhost:5173,http://localhost:3000",\n)\n  .split(",")\n  .map((origin) => origin.trim())\n  .filter(Boolean);'''
          new_cors = '''const CORS_ORIGINS = Array.from(\n  new Set(\n    [\n      "https://yashwanthputtarajegowda.github.io",\n      ...String(\n        process.env.CORS_ORIGINS ||\n          "http://localhost:5173,http://localhost:3000",\n      ).split(","),\n    ]\n      .map((origin) => origin.trim().replace(/\\/$/, ""))\n      .filter(Boolean),\n  ),\n);'''
          if old_cors in text:
              text = text.replace(old_cors, new_cors, 1)
          elif '"https://yashwanthputtarajegowda.github.io"' not in text:
              raise SystemExit('Expected server CORS block not found')

          if 'createFollowRequestsRouter' not in text:
              marker = 'import { createMessagesRouter } from "./routes/messages.js";'
              assert marker in text, 'messages import marker not found'
              text = text.replace(
                  marker,
                  marker + '\nimport { createFollowRequestsRouter } from "./routes/follow-requests.js";',
                  1,
              )
              mount = 'app.use("/api", createMessagesRouter({ db, requireUser }));'
              assert mount in text, 'messages mount marker not found'
              text = text.replace(
                  mount,
                  mount + '\napp.use("/api", createFollowRequestsRouter({ db, requireUser }));',
                  1,
              )

          backend.write_text(text)
          PY

      - name: Remove one-time workflow
        run: rm -f .github/workflows/fix-audit-issues.yml

      - name: Commit backend fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/fix-audit-issues.yml
          git commit -m "chore: apply backend audit fixes" || exit 0
          git push
