name: Format repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Format source and config files
        run: npx --yes prettier@3.9.6 --write "**/*.{js,mjs,json,css,html}" --ignore-path .gitignore --ignore-pattern ".github/workflows/**"

      - name: Remove temporary formatter
        run: rm -f .github/workflows/format-repository.yml

      - name: Commit formatting-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git commit -m "chore: format repository"
          git push
