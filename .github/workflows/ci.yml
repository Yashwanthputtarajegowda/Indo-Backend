name: Indo Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check server syntax
        run: node --check server.js

      - name: Check earnings route syntax
        run: node --check routes/earnings.js

      - name: Check story route syntax
        run: node --check routes/story-upload.js
