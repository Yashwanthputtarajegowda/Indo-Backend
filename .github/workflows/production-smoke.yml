name: Production Smoke Check

on:
  push:
    branches: [main]

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    env:
      BASE_URL: https://indo-backend-456919073297.asia-south1.run.app
      EXPECTED_BACKEND_VERSION: 20260817-google-telegram-v3
    steps:
      - name: Wait for deployed backend revision
        run: |
          set -euo pipefail
          for _ in $(seq 1 60); do
            body=$(curl --silent --show-error --max-time 10 "$BASE_URL/api/health" || true)
            version=$(printf '%s' "$body" | jq -r '.backendVersion // empty' 2>/dev/null || true)
            if [ "$version" = "$EXPECTED_BACKEND_VERSION" ]; then
              printf '%s\n' "$body"
              exit 0
            fi
            sleep 5
          done
          echo "Expected backend revision $EXPECTED_BACKEND_VERSION was not deployed in time."
          curl --silent --show-error --max-time 10 "$BASE_URL/api/health" || true
          exit 1

      - name: Check production CORS preflight for upload
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --max-time 20 -D - -o /dev/null \
            -X OPTIONS \
            -H 'Origin: https://yashwanthputtarajegowda.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-upload-id,x-file-name,x-file-size,x-mime-type,x-media-type' \
            "$BASE_URL/api/telegram/uploads")
          printf '%s\n' "$response"
          printf '%s\n' "$response" | grep -Eiq '^access-control-allow-origin:[[:space:]]*https://yashwanthputtarajegowda.github.io[[:space:]]*$'
          printf '%s\n' "$response" | grep -Eiq '^access-control-allow-methods:'
          printf '%s\n' "$response" | grep -Eiq '^access-control-allow-headers:.*x-upload-id'

      - name: Protected Telegram upload rejects anonymous access
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
            -X POST \
            -H 'Content-Type: application/octet-stream' \
            --data-binary '' \
            "$BASE_URL/api/telegram/uploads")
          test "$status" = "401"

      - name: Telegram storage health is reachable
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/api/telegram/storage-health"

      - name: Legacy video view rejects anonymous access
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
            -X POST \
            "$BASE_URL/api/media/videos/test/view")
          test "$status" = "200" -o "$status" = "404"

      - name: Account contact rejects anonymous access
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
            -X PATCH \
            -H 'Content-Type: application/json' \
            --data '{"mobile":"9999999999","email":"test@example.com"}' \
            "$BASE_URL/api/account/contact")
          test "$status" = "401"

      - name: Private-profile route rejects malformed identifiers safely
        run: |
          set -euo pipefail
          status=$(curl --silent --show-error --max-time 20 -o /dev/null -w '%{http_code}' \
            "$BASE_URL/api/account/public-profile/%2e%2e")
          test "$status" = "400"
