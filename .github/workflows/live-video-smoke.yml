name: Live video smoke
on:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check health
        run: |
          set -e
          curl -fsS https://indo-backend-production-41b1.up.railway.app/api/health
      - name: Check videos endpoint
        run: |
          set -e
          body="$(curl -fsS 'https://indo-backend-production-41b1.up.railway.app/api/media/videos?limit=5')"
          echo "$body"
          node -e 'const d=JSON.parse(process.argv[1]); if(!d.ok) process.exit(1); for(const v of (d.videos||[])){ console.log(JSON.stringify({id:v.id,mediaType:v.mediaType,secureUrl:v.secureUrl,videoUrl:v.videoUrl})); }' "$body"
