name: Deploy Indo Backend to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cloud-run
  cancel-in-progress: true

env:
  PROJECT_ID: indo-174f0
  REGION: asia-south1
  SERVICE: indo-backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify deployment credential is configured
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$GCP_SA_KEY" ]; then
            echo "Missing GitHub Actions secret: GCP_SA_KEY"
            echo "Add the Google Cloud service-account JSON as repository secret GCP_SA_KEY."
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        timeout-minutes: 15
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          source: .
          flags: '--allow-unauthenticated'
          wait: true

      - name: Configure Firebase runtime credentials
        timeout-minutes: 5
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          key = json.loads(os.environ["GCP_SA_KEY"])
          project_id = str(key.get("project_id") or "indo-174f0")
          client_email = str(key.get("client_email") or "")
          private_key = str(key.get("private_key") or "")

          if not client_email or not private_key:
              raise SystemExit("GCP_SA_KEY is missing client_email or private_key")

          for value in (client_email, private_key):
              print(f"::add-mask::{value}")

          subprocess.run(
              [
                  "gcloud", "run", "services", "update", os.environ["SERVICE"],
                  "--region", os.environ["REGION"],
                  "--project", os.environ["PROJECT_ID"],
                  "--update-env-vars",
                  f"FIREBASE_PROJECT_ID={project_id},FIREBASE_CLIENT_EMAIL={client_email},FIREBASE_PRIVATE_KEY={private_key}",
              ],
              check=True,
          )
          PY

      - name: Configure Google Drive runtime credentials
        timeout-minutes: 5
        env:
          GOOGLE_DRIVE_CLIENT_ID: ${{ secrets.GOOGLE_DRIVE_CLIENT_ID }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REDIRECT_URI: ${{ secrets.GOOGLE_DRIVE_REDIRECT_URI }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: |
          set -euo pipefail
          for name in GOOGLE_DRIVE_CLIENT_ID GOOGLE_DRIVE_CLIENT_SECRET GOOGLE_DRIVE_REDIRECT_URI GOOGLE_DRIVE_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

          for value in "$GOOGLE_DRIVE_CLIENT_ID" "$GOOGLE_DRIVE_CLIENT_SECRET" "$GOOGLE_DRIVE_REDIRECT_URI" "$GOOGLE_DRIVE_REFRESH_TOKEN" "$GOOGLE_DRIVE_FOLDER_ID"; do
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
            fi
          done

          args=(
            "gcloud" "run" "services" "update" "$SERVICE"
            "--region" "$REGION"
            "--project" "$PROJECT_ID"
            "--update-env-vars"
            "GOOGLE_DRIVE_CLIENT_ID=$GOOGLE_DRIVE_CLIENT_ID,GOOGLE_DRIVE_CLIENT_SECRET=$GOOGLE_DRIVE_CLIENT_SECRET,GOOGLE_DRIVE_REDIRECT_URI=$GOOGLE_DRIVE_REDIRECT_URI,GOOGLE_DRIVE_REFRESH_TOKEN=$GOOGLE_DRIVE_REFRESH_TOKEN"
          )

          if [ -n "$GOOGLE_DRIVE_FOLDER_ID" ]; then
            args+=("--update-env-vars" "GOOGLE_DRIVE_FOLDER_ID=$GOOGLE_DRIVE_FOLDER_ID")
          fi

          "${args[@]}"

      - name: Route 100% traffic to latest revision
        timeout-minutes: 5
        run: |
          set -euo pipefail
          gcloud run services update-traffic "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --to-latest

      - name: Verify live revision
        timeout-minutes: 5
        run: |
          set -euo pipefail
          expected="20260821-google-drive-delete-v2"
          live_url=$(gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='value(status.url)')

          if [ -z "$live_url" ]; then
            echo "Cloud Run service URL could not be determined."
            exit 1
          fi

          echo "Checking live Cloud Run URL: $live_url"

          for _ in $(seq 1 60); do
            body=$(curl --silent --show-error --max-time 15 "$live_url/api/health" || true)
            echo "$body"
            version=$(printf '%s' "$body" | jq -r '.backendVersion // empty' 2>/dev/null || true)
            firebase_admin=$(printf '%s' "$body" | jq -r '.firebaseAdmin // false' 2>/dev/null || true)
            database_configured=$(printf '%s' "$body" | jq -r '.databaseConfigured // false' 2>/dev/null || true)
            if [ "$version" = "$expected" ] && [ "$firebase_admin" = "true" ] && [ "$database_configured" = "true" ]; then
              echo "Live backend revision and Firebase runtime verified: $version"
              exit 0
            fi
            sleep 5
          done

          echo "Cloud Run did not expose the expected healthy backend revision: $expected"
          echo "Live URL checked: $live_url"
          echo "Inspecting Cloud Run service state before failing..."
          gcloud run services describe "$SERVICE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='yaml(status.url,status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic)'
          exit 1
