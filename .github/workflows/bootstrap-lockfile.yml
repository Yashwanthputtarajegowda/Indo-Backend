name: Bootstrap package lockfile

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "package.json"
      - ".github/workflows/bootstrap-lockfile.yml"

permissions:
  contents: write
  pull-requests: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Create or update lockfile PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -s package-lock.json ]; then
            echo "package-lock.json was not generated" >&2
            exit 1
          fi

          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date."
            exit 0
          fi

          branch="security/bootstrap-package-lock"
          git checkout -B "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: add npm lockfile"
          git push --force-with-lease origin "$branch"

          existing=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "chore: add npm lockfile" \
              --body "Generate and pin the npm dependency tree so npm ci and dependency audits are deterministic."
          else
            echo "PR #$existing already exists; branch has been refreshed."
          fi
