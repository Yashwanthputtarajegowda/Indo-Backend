name: Repair video list query
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: "!contains(github.event.head_commit.message, '[video-query-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify backend and create deploy trigger
        run: |
          set -e
          node --check server.js
          printf '\n// Railway deploy trigger: keep video-feed fix live.\n' >> server.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js .github/workflows/fix-video-list.yml
          git commit -m 'fix: deploy live video feed query [video-query-fixed]'
          git push
