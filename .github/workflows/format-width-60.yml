name: Format width 60
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Format source
        run: >-
          npx --yes prettier@3.9.6 --write --print-width 60
          "routes/**/*.{js,mjs,css,html}"
          "services/**/*.{js,mjs,css,html}"
          "scripts/**/*.{js,mjs,json}"
          "*.{js,mjs,json,css,html}" --ignore-path .gitignore
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/format-width-60.yml
          git add routes services scripts *.js *.mjs *.json *.css *.html 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: format source at 60 columns"
          git push
