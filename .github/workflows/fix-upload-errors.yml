name: Apply upload error sanitization
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.event.head_commit.message != 'chore: apply upload error sanitization'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Sanitize upload endpoint errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text()
          old = 'error: error.message || "Cloudinary is not configured.",'
          new = 'error: "Video upload service is temporarily unavailable. Please try again later.",'
          if old not in s:
              raise SystemExit('expected upload error handler not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/fix-upload-errors.yml
          git commit -m "chore: apply upload error sanitization"
          git push
