name: Format width 80
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Format source
        run: >-
          npx --yes prettier@3.9.6 --write --print-width 80
          "routes/**/*.{js,mjs,css,html}"
          "services/**/*.{js,mjs,css,html}"
          "scripts/**/*.{js,mjs,json}"
          "*.{js,mjs,json,css,html}"
          --ignore-path .gitignore
          --ignore-pattern ".github/workflows/**"
      - name: Commit formatting
        run: |
          rm -f .github/workflows/format-width-80.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: format repository at 80 columns"
          git push
