name: Add public profile route
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[public-profile-route]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert public profile routes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('server.js')
          s = p.read_text()
          marker = 'app.get("/api/account/me", async (req, res) => {'
          if marker not in s:
              raise SystemExit('account/me route marker not found')
          username_route = '''app.get("/api/account/profile/:username", async (req, res) => {
            if (!db) return res.status(503).json({ ok: false, error: "Service unavailable." });
            const username = normalizeUserId(req.params.username);
            if (!validUserId(username)) return res.status(400).json({ ok: false, error: "Invalid User ID." });
            try {
              const claim = await db.ref(`usernames/${userIdKey(username)}`).get();
              if (!claim.exists() || !claim.val()?.uid) return res.status(404).json({ ok: false, error: "Profile not found." });
              const profileSnapshot = await db.ref(`users/${claim.val().uid}`).get();
              if (!profileSnapshot.exists()) return res.status(404).json({ ok: false, error: "Profile not found." });
              return res.json({ ok: true, profile: profileSnapshot.val() });
            } catch {
              return res.status(500).json({ ok: false, error: "Could not load profile." });
            }
          });

          '''
          uid_route = '''app.get("/api/account/public-profile/:uid", async (req, res) => {
            if (!db) return res.status(503).json({ ok: false, error: "Service unavailable." });
            const uid = String(req.params.uid || "").trim();
            if (!uid || uid.length > 128) return res.status(400).json({ ok: false, error: "Invalid profile UID." });
            try {
              const profileSnapshot = await db.ref(`users/${uid}`).get();
              if (!profileSnapshot.exists()) return res.status(404).json({ ok: false, error: "Profile not found." });
              const profile = profileSnapshot.val() || {};
              return res.json({ ok: true, profile: profile.profile || profile });
            } catch {
              return res.status(500).json({ ok: false, error: "Could not load profile." });
            }
          });

          '''
          if 'app.get("/api/account/profile/:username"' not in s:
              s = s.replace(marker, username_route + marker, 1)
          if 'app.get("/api/account/public-profile/:uid"' not in s:
              s = s.replace(marker, uid_route + marker, 1)
          p.write_text(s)
          PY
          node --check server.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js .github/workflows/add-public-profile-route.yml
          git commit -m 'fix: complete public profile lookup routes [public-profile-route]'
          git push
