name: Apply video query fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[video-query-fixed]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace video query
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('server.js')
          s = p.read_text()
          pattern = re.compile(
              r'const snapshot = await db\.ref\("videos"\)\.orderByChild\("createdAt"\)\.limitToLast\(100\)\.get\(\);\n'
              r'    let videos = Object\.values\(snapshot\.val\(\) \|\| \{\}\)\.filter\(\(item\) => item && \(item\.secureUrl \|\| item\.videoUrl\)\)\.sort\(\(a, b\) => Number\(b\.createdAt \|\| 0\) - Number\(a\.createdAt \|\| 0\)\);'
          )
          replacement = (
              'const snapshot = await db.ref("videos").get();\n'
              '    let videos = Object.values(snapshot.val() || {})\n'
              '      .filter((item) => item && (item.secureUrl || item.videoUrl || item.url))\n'
              '      .sort((a, b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));'
          )
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit('video query pattern not found')
          p.write_text(s2)
          PY
          node --check server.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.js
          git commit -m 'fix: repair video feed query [video-query-fixed]'
          git push
